name: ci

on:
  push:
  pull_request:

jobs:
  briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: briefing
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: muse-briefing demo --out out
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: briefing-preview
          path: briefing/out/briefing.png

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x firmware/*.sh web-flasher/*.sh simulator/linux-gadget/*.sh

  # The emulator against the real firmware: fetch the pinned SDK so the test
  # suite compiles the firmware's dither_color() and compares it with the
  # Python port, and check the Linux gadget patch still applies and passes the
  # SDK's own tests.
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: firmware/fetch-sdk.sh
      - run: pip install -e './briefing[test]'
      - run: pytest -q briefing/tests/test_emulator.py
      - run: simulator/linux-gadget/prepare.sh
      - name: Linux SDK tests on the patched gadget
        working-directory: simulator/linux-gadget/.build/linux
        run: |
          pip install -e '.[test]'
          python -m pytest -q tests
