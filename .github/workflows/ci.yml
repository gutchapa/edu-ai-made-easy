name: ci

on:
  push:
  pull_request:

jobs:
  briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: briefing
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: muse-briefing demo --out out
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: briefing-preview
          path: briefing/out/briefing.png

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x firmware/*.sh
